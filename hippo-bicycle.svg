<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="一只河马骑自行车的卡通矢量插画（带循环动画）">
  <title>河马骑自行车</title>
  <desc>卡通矢量插画：灰紫色的河马骑着红色自行车前进。车轮转动、双腿沿脚踏圆周蹬踏、身体轻微起伏、云朵飘动、眼睛会眨。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ada84"/>
      <stop offset="1" stop-color="#63b857"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#b0a5cd"/>
      <stop offset="1" stop-color="#867aa8"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#bcb2d8"/>
      <stop offset="1" stop-color="#9488b6"/>
    </linearGradient>
    <linearGradient id="snoutGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d3a4ae"/>
      <stop offset="1" stop-color="#b57f8d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8cc"/>
      <stop offset="1" stop-color="#ffd24a"/>
    </radialGradient>

    <g id="wheel">
      <circle r="72" fill="none" stroke="#2b2b38" stroke-width="15"/>
      <circle r="62" fill="none" stroke="#e3e9f4" stroke-width="6"/>
      <g stroke="#c3ccdd" stroke-width="3">
        <line x1="0" y1="-59" x2="0" y2="59"/>
        <line x1="0" y1="-59" x2="0" y2="59" transform="rotate(30)"/>
        <line x1="0" y1="-59" x2="0" y2="59" transform="rotate(60)"/>
        <line x1="0" y1="-59" x2="0" y2="59" transform="rotate(90)"/>
        <line x1="0" y1="-59" x2="0" y2="59" transform="rotate(120)"/>
        <line x1="0" y1="-59" x2="0" y2="59" transform="rotate(150)"/>
      </g>
      <circle r="11" fill="#4a4a5f"/>
      <circle r="4" fill="#e3e9f4"/>
    </g>
    <g id="puff">
      <ellipse cx="0" cy="0" rx="62" ry="27"/>
      <ellipse cx="-42" cy="12" rx="42" ry="20"/>
      <ellipse cx="46" cy="12" rx="40" ry="18"/>
    </g>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 太阳：缓慢呼吸 -->
  <circle cx="118" cy="98" r="54" fill="url(#sun)">
    <animate attributeName="r" values="54;58;54" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>

  <!-- 云朵：左右缓慢摇摆 -->
  <g fill="#ffffff" opacity="0.9">
    <use href="#puff" transform="translate(646 96)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;18 0;0 0;-18 0;0 0" dur="26s" repeatCount="indefinite"/>
  </g>
  <g fill="#ffffff" opacity="0.65">
    <use href="#puff" transform="translate(322 74) scale(0.82)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-14 0;0 0;14 0;0 0" dur="34s" repeatCount="indefinite"/>
  </g>

  <!-- 远山 -->
  <path d="M0 500 Q120 424 268 466 Q400 500 512 468 Q666 428 800 484 L800 500 Z" fill="#b6e79c" opacity="0.9"/>

  <!-- 地面 -->
  <rect x="0" y="500" width="800" height="100" fill="url(#ground)"/>
  <path d="M0 534 H800" stroke="#ffffff" stroke-width="5" stroke-dasharray="34 26" opacity="0.65"/>
  <ellipse cx="400" cy="504" rx="228" ry="17" fill="#3f7a35" opacity="0.28"/>

  <!-- 速度线：向左流动并淡出 -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
    <g>
      <path d="M96 292 h46"/>
      <path d="M70 336 h64"/>
      <path d="M104 380 h36"/>
      <animateTransform attributeName="transform" type="translate" values="24 0;-44 0" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" keyTimes="0;0.22;1" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ================= 远侧曲柄 / 脚踏 / 腿 ================= -->
  <g id="crank-far">
    <line x1="392" y1="424" x2="364" y2="400" stroke="#3b3b4a" stroke-width="9" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 392 424" to="360 392 424" dur="1.4s" repeatCount="indefinite"/>
  </g>
  <path id="leg-far" d="M354.0 288.0 Q484.2 258.4 364.0 389.0" stroke="#655b85" stroke-width="36" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" values="M354.0 288.0 Q484.2 258.4 364.0 389.0;M354.0 288.0 Q484.2 233.9 379.8 378.2;M354.0 288.0 Q476.9 221.0 398.8 376.8;M354.0 288.0 Q470.3 227.5 416.0 385.0;M354.0 288.0 Q464.0 249.7 426.8 400.8;M354.0 288.0 Q454.2 279.4 428.2 419.8;M354.0 288.0 Q440.2 307.6 420.0 437.0;M354.0 288.0 Q428.6 324.4 404.2 447.8;M354.0 288.0 Q428.8 324.7 385.2 449.2;M354.0 288.0 Q440.3 314.4 368.0 441.0;M354.0 288.0 Q457.1 299.6 357.2 425.2;M354.0 288.0 Q473.6 281.4 355.8 406.2;M354.0 288.0 Q484.2 258.4 364.0 389.0" dur="1.4s" repeatCount="indefinite" calcMode="linear"/>
  </path>
  <g id="foot-far">
    <rect x="340" y="393.5" width="48" height="13" rx="6.5" fill="#2b2b38"/>
    <rect x="341" y="380.5" width="46" height="21" rx="10" fill="#4e4667" transform="rotate(-8 364 391)"/>
    <animateTransform attributeName="transform" type="translate" values="-0.0,0.0;15.8,-10.8;34.8,-12.2;52.0,-4.0;62.8,11.8;64.2,30.8;56.0,48.0;40.2,58.8;21.2,60.2;4.0,52.0;-6.8,36.2;-8.2,17.2;-0.0,0.0" dur="1.4s" repeatCount="indefinite" calcMode="linear"/>
  </g>

  <!-- ================= 车轮（转动） ================= -->
  <g transform="translate(250 428)"><g id="wheel-rear">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
  </g></g>
  <g transform="translate(550 428)"><g id="wheel-front">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
  </g></g>

  <!-- ================= 车架 ================= -->
  <g fill="none" stroke-linecap="round">
    <path d="M250 418 L392 402 M250 438 L392 446" stroke="#4a4a5f" stroke-width="3"/>
    <circle cx="392" cy="424" r="22" stroke="#3b3b4a" stroke-width="6"/>
    <circle cx="250" cy="428" r="10" stroke="#3b3b4a" stroke-width="4"/>
    <g stroke="#e4572e" stroke-width="13">
      <line x1="250" y1="428" x2="392" y2="424"/>
      <line x1="250" y1="428" x2="338" y2="292"/>
      <line x1="392" y1="424" x2="338" y2="292"/>
      <line x1="392" y1="424" x2="524" y2="322"/>
      <line x1="338" y1="292" x2="508" y2="282"/>
    </g>
    <line x1="508" y1="282" x2="524" y2="322" stroke="#c9431f" stroke-width="17"/>
    <path d="M524 322 Q542 372 550 428" stroke="#3b3b4a" stroke-width="11"/>
    <line x1="338" y1="294" x2="334" y2="274" stroke="#3b3b4a" stroke-width="10"/>
    <path d="M288 274 Q334 258 380 270 Q388 284 362 288 L300 288 Q282 284 288 274 Z" stroke="none" fill="#3b3b4a"/>
    <line x1="508" y1="282" x2="504" y2="262" stroke="#3b3b4a" stroke-width="10"/>
  </g>

  <!-- ================= 近侧曲柄 / 脚踏 / 腿 ================= -->
  <g id="crank-near">
    <line x1="392" y1="424" x2="420" y2="448" stroke="#3b3b4a" stroke-width="9" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 392 424" to="360 392 424" dur="1.4s" repeatCount="indefinite"/>
  </g>
  <g id="foot-near">
    <rect x="396" y="441.5" width="48" height="13" rx="6.5" fill="#2b2b38"/>
    <rect x="397" y="428" width="46" height="22" rx="10" fill="#6f6490" transform="rotate(-10 420 439)"/>
    <animateTransform attributeName="transform" type="translate" values="0.0,-0.0;-15.8,10.8;-34.8,12.2;-52.0,4.0;-62.8,-11.8;-64.2,-30.8;-56.0,-48.0;-40.2,-58.8;-21.2,-60.2;-4.0,-52.0;6.8,-36.2;8.2,-17.2;0.0,-0.0" dur="1.4s" repeatCount="indefinite" calcMode="linear"/>
  </g>
  <path id="leg-near" d="M370.0 286.0 Q463.8 299.7 420.0 437.0" stroke="#a89dc6" stroke-width="42" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" values="M370.0 286.0 Q463.8 299.7 420.0 437.0;M370.0 286.0 Q451.3 318.0 404.2 447.8;M370.0 286.0 Q448.1 322.9 385.2 449.2;M370.0 286.0 Q456.7 317.4 368.0 441.0;M370.0 286.0 Q472.7 306.6 357.2 425.2;M370.0 286.0 Q490.5 292.0 355.8 406.2;M370.0 286.0 Q504.3 271.4 364.0 389.0;M370.0 286.0 Q508.3 245.8 379.8 378.2;M370.0 286.0 Q502.5 227.2 398.8 376.8;M370.0 286.0 Q494.7 227.8 416.0 385.0;M370.0 286.0 Q487.5 245.8 426.8 400.8;M370.0 286.0 Q477.5 272.7 428.2 419.8;M370.0 286.0 Q463.8 299.7 420.0 437.0" dur="1.4s" repeatCount="indefinite" calcMode="linear"/>
  </path>

  <!-- ================= 河马：手臂 ================= -->
  <path d="M462 212 Q452 232 451 254" stroke="#a89dc6" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M486 222 Q532 234 556 252" stroke="#a89dc6" stroke-width="34" fill="none" stroke-linecap="round"/>

  <!-- ================= 河马：躯干与头（随踏频轻微起伏） ================= -->
  <g id="hippo-bob">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0;0 -3;0 0" dur="1.4s" repeatCount="indefinite" calcMode="linear"/>

    <!-- 尾巴（摇摆） -->
    <g id="tail">
      <path d="M222 234 Q186 226 189 258 Q192 282 214 276" stroke="#8b7fae" stroke-width="11" fill="none" stroke-linecap="round"/>
      <circle cx="215" cy="277" r="9" fill="#6f6490"/>
      <animateTransform attributeName="transform" type="rotate" values="0 222 234;-9 222 234;0 222 234;9 222 234;0 222 234" dur="1.4s" repeatCount="indefinite"/>
    </g>

    <ellipse cx="330" cy="212" rx="118" ry="88" fill="url(#bodyGrad)"/>
    <ellipse cx="348" cy="250" rx="78" ry="50" fill="#cdc3e4" opacity="0.85"/>
    <ellipse cx="288" cy="168" rx="62" ry="38" fill="#ffffff" opacity="0.16" transform="rotate(-22 288 168)"/>

    <!-- 耳朵（头之后画，所以先放这里靠下层） -->
    <g>
      <ellipse cx="428" cy="74" rx="18" ry="23" fill="#8b7fae" transform="rotate(-26 428 74)"/>
      <ellipse cx="428" cy="75" rx="8" ry="12" fill="#cbaabd" transform="rotate(-26 428 75)"/>
      <ellipse cx="500" cy="58" rx="18" ry="23" fill="#8b7fae" transform="rotate(13 500 58)"/>
      <ellipse cx="500" cy="59" rx="8" ry="12" fill="#cbaabd" transform="rotate(13 500 59)"/>
    </g>

    <!-- 头 -->
    <path d="M392 146 C392 88 448 60 504 70 C566 80 612 110 646 146 C670 172 656 210 622 218 C574 230 494 238 446 228 C408 220 390 188 392 146 Z" fill="url(#headGrad)"/>
    <ellipse cx="592" cy="184" rx="64" ry="46" fill="url(#snoutGrad)"/>
    <ellipse cx="604" cy="152" rx="9" ry="6.5" fill="#7a5560" transform="rotate(-18 604 152)"/>
    <ellipse cx="637" cy="164" rx="9" ry="6.5" fill="#7a5560" transform="rotate(-18 637 164)"/>
    <ellipse cx="508" cy="182" rx="17" ry="10" fill="#e08a9a" opacity="0.4"/>
    <path d="M540 202 Q592 228 648 196" stroke="#7a5560" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- 眼睛（会眨） -->
    <g transform="translate(516 114)"><g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.08;1 1;1 1" keyTimes="0;0.45;0.48;0.51;1" dur="4.4s" repeatCount="indefinite"/>
      <circle r="16" fill="#ffffff"/>
      <circle cx="3" cy="1" r="8" fill="#3a3348"/>
      <circle cx="6" cy="-3" r="3" fill="#ffffff"/>
    </g></g>
    <g transform="translate(580 126)"><g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.08;1 1;1 1" keyTimes="0;0.45;0.48;0.51;1" dur="4.4s" repeatCount="indefinite"/>
      <circle r="16" fill="#ffffff"/>
      <circle cx="3" cy="1" r="8" fill="#3a3348"/>
      <circle cx="6" cy="-3" r="3" fill="#ffffff"/>
    </g></g>
    <g stroke="#6f6490" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M499 95 Q516 86 533 95"/>
      <path d="M563 107 Q580 98 597 107"/>
    </g>
  </g>

  <!-- ================= 车把 ================= -->
  <path d="M446 262 Q504 244 562 262" stroke="#3b3b4a" stroke-width="11" fill="none" stroke-linecap="round"/>
  <rect x="432" y="250" width="32" height="17" rx="8.5" fill="#22222c" transform="rotate(-10 448 258)"/>
  <rect x="544" y="250" width="32" height="17" rx="8.5" fill="#22222c" transform="rotate(10 560 258)"/>
  <!-- 车铃（叮叮） -->
  <g>
    <circle cx="492" cy="243" r="10" fill="#ffd166" stroke="#c9a227" stroke-width="3"/>
    <circle cx="489" cy="240" r="2.6" fill="#fff3bf"/>
    <animateTransform attributeName="transform" type="rotate" values="0 492 248;0 492 248;-7 492 248;5 492 248;0 492 248" keyTimes="0;0.55;0.7;0.85;1" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <!-- ================= 握把的手 ================= -->
  <ellipse cx="452" cy="254" rx="21" ry="17" fill="#9c91bd"/>
  <ellipse cx="556" cy="254" rx="21" ry="17" fill="#9c91bd"/>
  <g stroke="#867aa8" stroke-width="4" stroke-linecap="round">
    <path d="M440 262 h24"/>
    <path d="M544 262 h24"/>
  </g>
</svg>
