# PhoneUse agent preset: the harness's own `standard` composition plus the row in
# phone-use.row.yml, giving a session the eight `phone_*` tools over the paired
# Termux `adb`.
#
# GENERATED by phone-use-preset/generate.mjs from this dsh's shipped standard preset
# — do not hand-edit: re-run the generator instead. It replaces the legacy
# `$DSH_HOME/.agent-presets/phone-use/` directory (preset.yml + agent.cordis.yml),
# which 0.1.7 no longer reads.
- insert:
    - id: preset-phone-use
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: phone-use
        name: 标准模式 + PhoneUse
        description: 标准模式的全部能力，外加 PhoneUse：通过已配对的 adb 直接操作这台安卓手机——截屏并以图像交给模型、读取可点击元素的真实像素坐标、点击、滑动、按键、输入文本、启动与停止应用。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          # The one row this preset adds to the shipped `standard` composition.
          # Kept as its own file so `generate.mjs` can rebuild the bundle patch from the
          # current shipped standard without this text living in two places.
          # ── PhoneUse ────────────────────────────────────────────────────────────────

          # Eyes and hands on this Android phone, through the Termux `adb` client already
          # paired to 127.0.0.1. Eight model-facing tools: `phone_status` (reachability,
          # model, screen, foreground app), `phone_screenshot` (the screen as an image the
          # model can actually look at), `phone_ui` (the accessibility tree as numbered
          # elements with REAL device-pixel tap coordinates), and the actions
          # `phone_tap`, `phone_swipe`, `phone_key`, `phone_text`, `phone_app`.
          #
          # The row registers into the host `tools` registry and publishes no service, so
          # it sits loose here like `tool-bash` rather than inside an isolate realm. It
          # CONSUMES the host `shell`, `fs`, and `attachments` services at call time; a
          # realm of its own would hide exactly those and its tools would stop reaching
          # them.
          #
          # The plugin module ships inside this bundle, but the row must name it as a
          # PACKAGE SPECIFIER, not as `./plugin/index.js`. A relative name is only anchored
          # to the patch file for top-level `insert` rows and for `group` rows:
          # `anchorInsertedPluginNames()` recurses into `entry.group && Array.isArray(config)`
          # and nothing else, so a name inside a preset declaration's `config.plugins` stays
          # relative and `Loader.import()` resolves it with `new URL(name, baseUrl)` —
          # against the PROFILE directory, where `plugin/index.js` does not exist. The row
          # then fails to import, the preset reports as broken, and the pickers drop it
          # entirely (they only offer presets whose audit is clean).
          #
          # The bare specifier resolves because patch 15 links every profile-installed
          # package into the install tree, and `Loader.import()` imports bare names from its
          # own location. Keep it in sync with `package.json`'s `name`. That module is
          # GENERATED from a verified source body — rebuild it with
          # `node phone-use/build.mjs --out phone-use-preset/plugin` in the workspace that
          # owns `phone-use/host.js`, and never hand-edit the generated file.
          #
          # This preset is a copy of `standard`, not of `cordis`: `tool-cordis` registers
          # process-global Host inspect providers, so a second cordis-family preset
          # standing in the same process collides with the shipped `cordis` mount. To get
          # both the Cordis toolset and PhoneUse, pick one base per process.
          #
          # Prerequisite: the Termux adb client connected to this device (`adb pair` once,
          # then `adb connect 127.0.0.1:<wireless-debugging-port>`). When that link is
          # down, `phone_status` reports connected=false and every other tool fails with
          # the reconnect recipe instead of guessing.
          - id: tool-phone-use
            name: '@local/dsh-phone-use-preset/plugin/index.js'
